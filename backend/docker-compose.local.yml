version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: affiliate_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CamDoi012@!}
      POSTGRES_DB: ${DB_NAME:-affiliate_catalog_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - affiliate_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: affiliate_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@domain.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-CamDoi012@!}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    networks:
      - affiliate_network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: affiliate_rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - affiliate_network

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  affiliate_network:
    driver: bridge